<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#F4F1E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="家庭点餐系统 · 菜品管理 / 筛选 / 点餐 / 有记忆的随机">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 手写体只是装饰，不该挡住首屏：googleapis 在国内经常要等好几秒，
       老手机上原来的写法是"整页空白半天"，很容易被当成"登不上"。
       media=print 让它异步加载，加载完再切回 all；没 JS 时也留了兜底 -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap"></noscript>
  <title>米粒爱吃饭</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // 老安卓 WebView 打不开这个应用，最常见的一条是 Object.hasOwn 不存在（Chrome 93+ 才有），
    // 而它被 Pinia 的产物直接写进了主包 —— 一上来就抛，界面白屏，看起来像"登录不上"。
    // 补一个等价实现比降构建目标便宜得多，也不影响新设备。
    if (!Object.hasOwn) {
      Object.defineProperty(Object, 'hasOwn', {
        value: function (obj, key) { return Object.prototype.hasOwnProperty.call(Object(obj), key); },
        configurable: true, writable: true,
      });
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
